envs:
  _target_: envs.so100_tower.SO100Tower
  num_envs: 256
  device: cuda:0
  venv_file: assets/SO100/tower/tower.venv
  max_episode_length: 500
  frame_skip: 4
  debug: false
  dof_pos_home: [0.0, 1.1540000438690186, -1.319200038909912, 0.906499981880188, -1.5439000129699707, 0.0]
  robot_root_pos: [0, 0, 0.25]
  box1_pose_initial: [0,0,0,0, -0.15, -0.25, 0.265]
  box2_pose_initial: [0,0,0,0, -0.1, -0.25, 0.265]
  box3_pose_initial: [0,0,0,0, 0.0, -0.3, 0.265]
  box4_pose_initial: [0,0,0,0, 0.1, -0.25, 0.265]
  box5_pose_initial: [0,0,0,0, 0.15, -0.25, 0.265]
  approach_quat: [0.5152, 0.0176, 0.0171, 0.8567] 
  rest_pose: [0.0004, 0.8569, 0.5154, 0.0076, 0.019, -0.224, 0.4] 
  rgb_cameras: ["wrist_cam"]
  use_segmentation_for_inference: false
  num_segmentation_objs: 4 # Target box, Tower, grippers
  max_delta_deg: [2.0, 2.0, 2.0, 2.0, 0.01, 5.0]

sac:
  network:
    lr_encoder: 0.0003
    # image_shift_pad: 4

    vision_networks:
      wrist_cam:
        latent_dim: 128
        cnn:
          features: [16, 32, 64, 128] # reduced
          kernels: [3, 3, 3, 3]
          strides: [2, 2, 2, 2]
          paddings: [0, 0, 0, 0]

    obs_latent_dim: 128
    mlp_critic:
      units: [256, 256]
      layer_norm: True
      weight_init: orthogonal
      ensemble: 4
    mlp_actor:
      units: [256, 256]
      layer_norm: False
      weight_init: orthogonal
    log_std_bounds: [-5, 2] # rlpd default [-20, 2]

  config:
    name: SO100Tower
    # score_to_win: 15

    # Adjustable params
    reward_shaper:
      scale_value: 10 # crucial, sensitive value, see Haarnoja 2018
    num_gradient_steps: 2 # can be varied between 1 - 16 depending on the task and weight initialization method
    # https://arxiv.org/abs/2211.11092: no upper bound for a good batch size when using layernorm
    # A large batch size is beneficial up till a batch of 2048
    # for this case. There is a performance trade-off.
    # Scale the lr by the sqrt of the batch size multiple.
    minibatch_size: 2048 # we can increase the batch for non-vision policies
    num_warmup_epochs: 0
    not_all_envs_are_synchronized: False

    # Replay buffers
    replay_buffer_ring:
      num_epochs: 10
    # replay_buffer_simple:
    #   capacity: 100000
    replay_buffer_prio:
      capacity: 50000
      prio: high
      reward_limit_0: -1.0
      update_limit: True
      swap_equal: True
    demonstration_ring_buffer:
      max_num_demos: 256
      trajectory_min_reward: 0.01
      ratio: 0.5
    write_replay_buffer_stats: True

    # Task-specific stats
    max_epochs: 1000
    num_epochs_reward_tracking: 1
    update_stats_freq: 1
    network_stats_freq: -1 # 10 # epochs

    # Fixed params - these should not even be parameters
    normalize_input: False # TODO: implement
    gamma: 0.99
    init_alpha: 1
    min_alpha: 0
    # rlpd default 3e-4 for a batch size of 256 --> scale lr by sqrt of batch size ratio
    alpha_lr: 0.000424
    actor_lr: 0.000424
    critic_lr: 0.000424
    critic_tau: 0.005 # 0.001...0.01 is ideal in Haarnoja 2018 - Ant-v1 task

    read_rgb_camera: True

agent:
  _target_: vlearn.rl_algos.sac.sac_agent.SacAgent
  params: ${sac}
  device: ${envs.device}
  envs: ${envs}
  writer_dir: runs/SO100Tower
  mode: train
  ckpt: null
  ckpt_mode: train
  profile: False
  demo_path: envs/utils/so100/runs/demonstrations/SO100Tower/demos.h5

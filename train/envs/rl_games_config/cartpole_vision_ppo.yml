# Adapted from https://github.com/NVIDIA-Omniverse/IsaacGymEnvs/blob/main/isaacgymenvs/cfg/train/AntPPO.yaml
params:

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None

        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    cnn:
      type: conv2d
      activation: relu
      initializer:
        name: default
      regularizer:
        name: None
      convs:    
        - filters: 16
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 32
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 32
          kernel_size: 3
          strides: 1
          padding: 0

    mlp:
      units: [128, 64, 32]
      activation: elu
      initializer:
        name: default

  config:
    name: Cartpole
    env_name: cartpole-env
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: False
    normalize_value: True
    num_actors: 1024
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.008
    score_to_win: 1000
    max_epochs: 500
    save_best_after: 50
    save_frequency: 25
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 4096
    mini_epochs: 2
    critic_coef: 2
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001
